# Stress-case sample for the visual dev loop. Never deployed (deploy.sh refuses a page not
# built from datasets.toml). Build: .venv/bin/python -m scripts.build_page \
#   --manifest examples/sample.toml --out previews/index.html --preview

notice = "Demo: sample datasets for layout testing."

[[dataset]]
slug = "campus-mobility-traces"
title = "Anonymized campus mobility traces from a two-semester sensing study"
description = """
Aggregated Wi-Fi association counts per building per 15-minute bin, two semesters.

No device identifiers are present. See the README for the binning method."""
license = "CC-BY-4.0"
source = "https://example.org/original/source/page"
contact = "mobility-study@example.org"
added = 2026-10-01
doi = "10.0000/example"

  [[dataset.file]]
  name = "README.md"
  url = "https://mghp.osn.xsede.org/bu-cds-public-data/demo/campus-mobility-traces/README.md"
  size = 812
  sha256 = "0f343b0931126a20f133d67c2b018a3b0f343b0931126a20f133d67c2b018a3b"

  [[dataset.file]]
  name = "mobility_counts_2025-fall_2026-spring_15min_by_building_with_weather_covariates_v2.parquet"
